name: Publish content to live site

# Ezt a workflow-t az admin felület "Mentés és közzététel" gombja indítja el,
# egy GitHub API hívással (repository_dispatch, event_type: content-publish),
# a szerkesztett szöveget is elküldve a hívásban. Kézzel is elindítható
# (workflow_dispatch) — ilyenkor a repóban jelenleg lévő tartalommal buildel,
# admin-adat nélkül (pl. csak kód-változás után újra akarod deploy-olni).

on:
  repository_dispatch:
    types: [content-publish]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write published content (ha admin-triggerelt)
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = context.payload.client_payload.content;
            fs.writeFileSync('app/content/site-content.json', JSON.stringify(content, null, 2) + '\n');

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run generate

      - name: Deploy via FTP to tárhely.eu
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          # A dedikált FTP-fiók eleve a public_html-be van zárva (chroot) —
          # belépéskor már annak a tartalmát látja, nem kell rá külön belépni.
          server-dir: ./
          # Sose törölje a szerveren azt, ami nincs a build kimenetében — ez
          # védi a sendmail.php-t, gallery.php-t, admin/ mappát, .htaccess-t stb.
          dangerous-clean-slate: false
          # IDEIGLENES: részletes napló, hogy lássuk a nyers FTP parancs/válasz
          # kommunikációt — ez segít kideríteni, mi okozza a mappa-létrehozási hibát.
          log-level: verbose
