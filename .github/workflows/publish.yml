name: Publish content to live site

# Ezt a workflow-t az admin felület "Mentés és közzététel" gombja indítja el,
# egy GitHub API hívással (repository_dispatch, event_type: content-publish).
# Kézzel is elindítható (workflow_dispatch) — mindkét esetben pontosan
# ugyanúgy viselkedik: azt buildeli, ami ÉPPEN a main ágon van.
#
# A szöveges tartalom (app/content/site-content.json) mostantól MINDIG a git
# main ága a forrása — az admin felület a "Mentés" gombra közvetlenül commitol
# ide a GitHub API-n keresztül, nincs többé külön szerver-oldali másolat, ami
# elcsúszhatna. Emiatt ennek a workflow-nak nem kell semmilyen szöveget
# "beleírnia" a build-be — egyszerűen csak buildeli, ami már ott van.
#
# A build eredményét NEM FTP-vel toljuk fel, és nem is hívjuk meg kívülről a
# szerverünket — a tárhelyünk egy bot-elhárító réteggel mindkettőt blokkolja
# (a GitHub Actions felől érkező FTP-írást ÉS a HTTP-kéréseket is, mert nem
# néznek ki "valódi böngészőnek"). Ehelyett "pull" alapú deploy-t használunk:
# becsomagoljuk a build-et egy GitHub Release-be, a szerveren pedig egy
# cPanel Cron Job néhány percenként lefuttatja az admin/pull-deploy.php-t
# HELYBEN (nem HTTP-n át) — ez így sosem ütközik a fenti korlátozásba, mert
# nem jön kívülről semmilyen kérés a szerver felé.

on:
  repository_dispatch:
    types: [content-publish]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run generate

      - name: Package build as zip
        run: cd .output/public && zip -r ../../public.zip . -x '.*'

      - name: Publish build as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete live-build --yes --cleanup-tag || true
          gh release create live-build public.zip \
            --title "Live build" \
            --notes "Automatikusan frissül minden közzétételkor — a szerveren futó cron job veszi fel innen néhány percen belül."

