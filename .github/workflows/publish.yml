name: Publish content to live site

# Ezt a workflow-t az admin felület "Mentés és közzététel" gombja indítja el,
# egy GitHub API hívással (repository_dispatch, event_type: content-publish),
# a szerkesztett szöveget is elküldve a hívásban. Kézzel is elindítható
# (workflow_dispatch) — ilyenkor a repóban jelenleg lévő tartalommal buildel,
# admin-adat nélkül (pl. csak kód-változás után újra akarod deploy-olni).
#
# A build eredményét NEM FTP-vel toljuk fel — a tárhelyünk valamiért blokkolja
# a kívülről (GitHub Actions IP-ről) érkező FTP írási/mappa-létrehozási
# műveleteket. Ehelyett "pull" alapú deploy-t használunk: becsomagoljuk a
# build-et egy GitHub Release-be, majd egy kimenő HTTPS hívással szólunk a
# szerverünknek (admin/pull-deploy.php), hogy MAGA töltse le és csomagolja ki —
# ez a kérés-irány sosem ütközik a fenti korlátozásba.

on:
  repository_dispatch:
    types: [content-publish]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write published content (ha admin-triggerelt)
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = context.payload.client_payload.content;
            fs.writeFileSync('app/content/site-content.json', JSON.stringify(content, null, 2) + '\n');

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run generate

      - name: Package build as zip
        run: cd .output/public && zip -r ../../public.zip . -x '.*'

      - name: Publish build as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete live-build --yes --cleanup-tag || true
          gh release create live-build public.zip \
            --title "Live build" \
            --notes "Automatikusan frissül minden közzétételkor — ezt tölti le a szerver."

      - name: Tell the server to pull & deploy the new build
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://grenmastudio.hu/admin/pull-deploy.php?token=${{ secrets.DEPLOY_TOKEN }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::A szerver nem tudta letölteni/kicsomagolni a build-et."
            exit 1
          fi
